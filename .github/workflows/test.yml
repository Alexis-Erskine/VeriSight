name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0

      - name: Install core Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask==3.1.1 Flask-SQLAlchemy==3.1.1 Flask-Migrate==4.1.0 \
            Flask-Bcrypt==1.0.1 Flask-CORS==5.0.1 PyJWT==2.10.1 python-dotenv==1.1.0 \
            psycopg2-binary==2.9.10 Werkzeug==3.1.3 email-validator==2.2.0 \
            reportlab==5.0.0
          pip install pytest==8.3.4 pytest-flask==1.3.0

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/ --ignore=E402,F401,E501

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FLASK_ENV: testing
