{% extends "base.html" %}
{% block title %}Detection Result{% endblock %}
{% block content %}
<div class="container" id="result-container" data-detection-id="{{ detection_id }}">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-text">Loading analysis result...</span>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('result-container');
    const detectionId = container.dataset.detectionId;
    if (detectionId) {
      loadResult(detectionId);
    }
  });
</script>
{% endblock %}
