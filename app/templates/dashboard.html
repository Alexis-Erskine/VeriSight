{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block content %}
<div class="dashboard-page container">
  <div class="dashboard-header fade-in">
    <h1>Recent Detections</h1>
    <a href="/upload" class="btn btn-primary">+ Upload New Video</a>
  </div>

  <div id="detections-container">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <span class="loading-text">Loading detections...</span>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async function() {
  const container = document.getElementById('detections-container');

  try {
    const res = await fetch('/api/results?page=1&per_page=20');
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Failed to load');
    }

    if (data.results.length === 0) {
      container.innerHTML = `
        <div class="empty-state fade-in-up">
          <div class="empty-icon">&#128249;</div>
          <h3>No Detections Yet</h3>
          <p>Upload your first video to start analyzing for deepfakes.</p>
          <a href="/upload" class="btn btn-primary btn-sm" style="margin-top:16px;display:inline-flex">Upload Video</a>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="detection-list fade-in-up">
        ${data.results.map(r => {
          const isDf = r.prediction_label === 'deepfake';
          const riskClass = r.risk_level || 'low';
          const badgeClass = r.status === 'completed' ? `risk-${riskClass}` : '';
          const badgeText = r.status === 'pending' ? 'Analyzing...' : (isDf ? 'Deepfake' : 'Authentic');
          const scoreText = r.prediction != null ? (r.prediction * 100).toFixed(1) + '%' : '--';
          return `
            <a href="/results/${r.id}" class="detection-item" style="text-decoration:none;color:inherit">
              <div class="detection-left">
                <div class="detection-icon">&#128249;</div>
                <div>
                  <div class="detection-name">${escapeHtml(r.filename)}</div>
                  <div class="detection-date">${formatDate(r.date_uploaded)}</div>
                </div>
              </div>
              <div class="detection-right">
                <span class="risk-badge ${badgeClass}" style="${r.status !== 'completed' ? 'opacity:0.5' : ''}">${badgeText}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.9rem;color:var(--text-muted)">${scoreText}</span>
              </div>
            </a>
          `;
        }).join('')}
      </div>
      ${data.pages > 1 ? `
        <div class="fade-in-up" style="text-align:center;margin-top:20px">
          <span style="color:var(--text-muted);font-size:0.9rem">
            Page ${data.page} of ${data.pages} &middot; ${data.total} total
          </span>
        </div>
      ` : ''}
    `;
  } catch (err) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">&#9888;</div>
        <h3>Failed to Load</h3>
        <p>${err.message || 'Could not load detections. Please try again.'}</p>
        <button onclick="location.reload()" class="btn btn-secondary btn-sm" style="margin-top:16px">Retry</button>
      </div>`;
  }
});

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  return new Date(dateStr).toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}
</script>
{% endblock %}
